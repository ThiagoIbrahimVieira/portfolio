<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="20" y="20" width="560" height="760" rx="24" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="5" filter="url(#stickerShadow)"/>
  
  <!-- Subtle Grid -->
  <pattern id="smallGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect x="25" y="25" width="550" height="750" rx="20" fill="url(#smallGrid)"/>

  <!-- Stylized Developer Silhouette with Die-Cut Border -->
  <g transform="translate(150, 180)">
    <!-- Die-Cut Halo -->
    <circle cx="150" cy="110" r="75" fill="none" stroke="#ffffff" stroke-width="8"/>
    <path d="M 40 380 C 40 240, 260 240, 260 380 Z" fill="none" stroke="#ffffff" stroke-width="8"/>

    <!-- Avatar Inner -->
    <circle cx="150" cy="110" r="70" fill="#1f1f26"/>
    <path d="M 45 378 C 45 245, 255 245, 255 378 Z" fill="#1f1f26"/>
    
    <!-- Face / Headphone Graphic -->
    <rect x="135" y="95" width="30" height="30" rx="6" fill="#fbbf24"/>
    <path d="M 68 110 A 82 82 0 0 1 232 110" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <rect x="62" y="95" width="16" height="32" rx="4" fill="#fbbf24"/>
    <rect x="222" y="95" width="16" height="32" rx="4" fill="#fbbf24"/>
  </g>

  <!-- Street-Tech Sticker Badges -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="170" height="38" rx="6" fill="#fbbf24" stroke="#000000" stroke-width="2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#000000">
      SLOT: HERO 3:4
    </text>
  </g>

  <g transform="translate(370, 70) rotate(4)">
    <rect x="0" y="0" width="160" height="36" rx="6" fill="#00d8ff" stroke="#000000" stroke-width="2"/>
    <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#000000">
      ETEC ITAPEVI
    </text>
  </g>

  <!-- Center Text / Instruction Placeholder -->
  <text x="300" y="630" text-anchor="middle" font-family="'Anton', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="2">
    THIAGO IBRAHIM
  </text>
  <text x="300" y="665" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#fbbf24">
    AGUARDANDO FOTO DIE-CUT DO FUNDADOR
  </text>
  <text x="300" y="695" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.5)">
    PROPORÇÃO RECOMENDADA: 3:4 VERTICAL
  </text>
</svg>
